name: Keep Backend & Database Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render (15m) and Supabase (7d) free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AlgoTrack /api/health
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL repository variable is not set. Skipping ping."
            exit 0
          fi
          echo "Pinging $HEALTH_URL ..."
          curl --fail --silent --show-error --max-time 30 "$HEALTH_URL"
          echo ""

